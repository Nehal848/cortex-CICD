<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In | Cortex CI/CD</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css', v='1.0.6') }}">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body class="elegant-body" style="min-height: 100vh; display: flex; flex-direction: column;">

  <!-- Aurora Background Effects -->
  <div class="aurora-bg">
    <div class="aurora-blob blob-1"></div>
    <div class="aurora-blob blob-2"></div>
  </div>

  <!-- Navigation -->
  <nav class="navbar elegant-nav">
    <div class="logo">
      <a href="{{ url_for('dashboard.index') }}" style="display: flex; align-items: center; gap: 0.6rem; color: inherit; text-decoration: none;">
        <img src="{{ url_for('static', filename='img/logo.png') }}" alt="Logo" style="height: 1.5em; width: auto; vertical-align: middle;">
        Cortex
      </a>
    </div>
    <ul class="nav-links">
      <li><a href="{{ url_for('dashboard.index') }}" class="nav-item">Back to Home</a></li>
    </ul>
  </nav>

  <!-- Login Card Container -->
  <div class="auth-container" style="flex: 1; display: flex; align-items: center; justify-content: center; padding: 2rem; position: relative; z-index: 2;">
    <div class="auth-card glass-panel" style="max-width: 440px; width: 100%; padding: 2.5rem; background: rgba(18, 18, 24, 0.75); border: 1px solid rgba(255, 255, 255, 0.1); border-radius: 16px; backdrop-filter: blur(20px); box-shadow: 0 20px 50px rgba(0,0,0,0.5);">
      <div class="auth-header" style="text-align: center; margin-bottom: 2rem;">
        <h2 style="font-size: 1.8rem; font-family: var(--font-serif); margin-bottom: 0.5rem; color: #fff;">Welcome Back</h2>
        <p style="color: var(--text-secondary); font-size: 0.9rem;">Access the Self-Healing pipeline control deck</p>
      </div>

      {% if error %}
      <div class="auth-error" style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171; padding: 0.8rem 1rem; border-radius: 8px; margin-bottom: 1.5rem; font-size: 0.85rem; display: flex; align-items: center; gap: 0.5rem;">
        <i class="fa-solid fa-triangle-exclamation"></i>
        <span>{{ error }}</span>
      </div>
      {% endif %}

      <form action="{{ url_for('auth.login') }}" method="POST">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
        <div class="form-group" style="margin-bottom: 1.25rem;">
          <label for="username" class="form-label" style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem;">Username</label>
          <input type="text" id="username" name="username" class="form-control" placeholder="Enter username" required autocomplete="username" style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 0.95rem;">
        </div>

        <div class="form-group" style="margin-bottom: 1.5rem;">
          <label for="password" class="form-label" style="display: block; font-size: 0.8rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--text-muted); margin-bottom: 0.5rem;">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required autocomplete="current-password" style="width: 100%; padding: 0.75rem 1rem; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); border-radius: 8px; color: #fff; font-size: 0.95rem;">
        </div>

        <button type="submit" class="btn elegant-btn-primary" style="width: 100%; padding: 0.85rem; font-size: 0.95rem; font-weight: 600; justify-content: center; display: flex; align-items: center; gap: 0.5rem;">
          <i class="fa-solid fa-right-to-bracket"></i>
          Authenticate
        </button>
      </form>

      <div class="text-center mt-4" style="font-size: 0.82rem; color: var(--text-muted); text-align: center; margin-top: 1.5rem;">
        <p><i class="fa-solid fa-circle-info" style="color: var(--accent-blue);"></i> Default username: <strong>admin</strong> (or credentials in your <code>.env</code> file)</p>
      </div>
    </div>
  </div>

</body>
</html>
