groups:
  - name: cortex_alerts
    interval: 30s
    rules:
      - alert: CortexHighErrorRate
        expr: rate(flask_http_request_total{status=~"5.."}[5m]) > 0.05
        for: 2m
        labels:
          severity: critical
        annotations:
          summary: "CortexCICD 5xx error rate above 5%"
          description: "More than 5% of requests are returning 5xx errors."

      - alert: CortexAPIDown
        expr: up{job="cortex-api"} == 0
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "CortexCICD API is unreachable"

      - alert: CortexWorkerDown
        expr: up{job="cortex-worker"} == 0
        for: 2m
        labels:
          severity: warning
        annotations:
          summary: "CortexCICD Worker is unreachable"

      - alert: CortexHealingEscalationSpike
        expr: increase(cortex_healing_events_total{outcome="Escalated"}[10m]) > 3
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "3+ healing escalations in 10 minutes — manual review needed"

      - alert: CortexHighRequestLatency
        expr: histogram_quantile(0.95, rate(flask_http_request_duration_seconds_bucket[5m])) > 2
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "CortexCICD P95 latency above 2 seconds"
