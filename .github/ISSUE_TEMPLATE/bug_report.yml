name: "Bug Report"
description: "File a bug report or unexpected behavior"
title: "[BUG]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: Thank you for reporting an issue in CortexCICD!
  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Start application with 'docker compose up'
        2. Post webhook to '/webhooks/jenkins'
        3. See error response...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What you expected to happen.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs / Output
      description: Relevant logs or terminal outputs.
      render: shell
  - type: dropdown
    id: environment
    attributes:
      label: Deployment Environment
      options:
        - Docker Compose
        - Kubernetes Cluster
        - Standalone WSGI / Gunicorn
        - Local Development (Flask)
    validations:
      required: true

