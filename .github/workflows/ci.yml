name: CortexCI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Run Test Suite (${{ matrix.os }} - Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Full Test Suite
        env:
          FLASK_ENV: testing
          SECRET_KEY: ci-test-secret-key-32-bytes-long
          ADMIN_PASSWORD: ci-admin-password
        run: |
          python tests/run_tests.py

      - name: Smoke Check WSGI Boot & Health Endpoints
        run: |
          python -c "import wsgi; c = wsgi.app.test_client(); assert c.get('/healthz').status_code == 200; assert c.get('/livez').status_code == 200; print('WSGI health check passed!')"

