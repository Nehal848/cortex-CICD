apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-api
  namespace: cortex-system
  labels:
    app: cortex-api
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cortex-api
  template:
    metadata:
      labels:
        app: cortex-api
    spec:
      securityContext:
        runAsNonRoot: true
      containers:
      - name: cortex-api
        image: cortex/api:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 5000
          name: http
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop: ["ALL"]
        resources:
          limits:
            memory: "512Mi"
            cpu: "500m"
          requests:
            memory: "256Mi"
            cpu: "250m"
        livenessProbe:
          httpGet:
            path: /livez
            port: 5000
          initialDelaySeconds: 15
          periodSeconds: 20
        readinessProbe:
          httpGet:
            path: /readyz
            port: 5000
          initialDelaySeconds: 10
          periodSeconds: 10
        env:
        - name: FLASK_ENV
          value: "production"
        - name: DISABLE_EMBEDDED_WORKER
          value: "true"
        - name: TRUSTED_PROXY_COUNT
          value: "1"
        - name: SESSION_COOKIE_SECURE
          value: "true"
        - name: ENFORCE_CSRF
          value: "true"
        - name: STRICT_WEBHOOK_VERIFICATION
          value: "true"
        envFrom:
        - secretRef:
            name: cortex-secrets
            optional: true
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: cortex-worker
  namespace: cortex-system
  labels:
    app: cortex-worker
spec:
  replicas: 3
  selector:
    matchLabels:
      app: cortex-worker
  template:
    metadata:
      labels:
        app: cortex-worker
    spec:
      serviceAccountName: cortex-healer-sa
      securityContext:
        runAsNonRoot: true
      containers:
      - name: cortex-worker
        image: cortex/worker:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 9101
          name: metrics
        securityContext:
          allowPrivilegeEscalation: false
        resources:
          limits:
            memory: "768Mi"
            cpu: "750m"
          requests:
            memory: "384Mi"
            cpu: "300m"
        env:
        - name: FLASK_ENV
          value: "production"
        - name: WORKER_METRICS_PORT
          value: "9101"
        envFrom:
        - secretRef:
            name: cortex-secrets
            optional: true
